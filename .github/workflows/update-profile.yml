name: Update profile

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - 'scripts/**'
      - 'data/personal.json'
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch data and generate profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh.py
      - name: Commit updated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/
          if git diff --cached --quiet; then
            echo 'Profile is already up to date.'
          else
            git commit -m 'chore: refresh public profile data'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload interactive website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy interactive website
        id: deployment
        uses: actions/deploy-pages@v4
